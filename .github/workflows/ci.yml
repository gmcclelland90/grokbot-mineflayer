name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check play.js
          node --check index.js
          node --check rl/score.js
      - name: Matrix graph
        run: node rl/ci-matrix.mjs
      - name: Score tests
        run: node rl/ci-score.mjs
